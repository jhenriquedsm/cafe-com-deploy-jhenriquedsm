services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafe"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cafe:cafe@db:5432/cafe
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy